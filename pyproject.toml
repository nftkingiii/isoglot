[project]
name = "isoglot"
version = "0.1.0"
description = "Measure and repair the cross-lingual safety gap of Tiny Aya in Hausa, Yoruba and Igbo with the Lexsi stack."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "auditkit==1.1.3",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
# GPU generation with the hf: backend
gpu = ["auditkit[transformers]==1.1.3", "accelerate"]
# Paid judge through any OpenAI-compatible endpoint
judge = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
isoglot = "isoglot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
